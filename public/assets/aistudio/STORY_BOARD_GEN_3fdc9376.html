<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNOCKSSTUDiOS 3D Interactive Logo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0a33 0%, #050510 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* UI Overlay */
        #ui-layer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 90%;
            max-width: 550px;
            z-index: 10;
        }
        #ai-output {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 15px;
            line-height: 1.6;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div id="ai-output"></div>
        <div class="button-group">
            <button onclick="triggerAction('logo')">KNOCKSSTUDiOS Logo</button>
            <button onclick="triggerAction('storyboard')">Generate Storyboard</button>
        </div>
    </div>

    <!-- Self-contained Three.js scene fallback check (Zero external CDN) -->
    <script>window.THREE = window.THREE || null;</script>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x8a2be2, 2, 100);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // Interactive 3D Object
        const geometry = new THREE.IcosahedronGeometry(2, 1);
        const material = new THREE.MeshStandardMaterial({
            color: 0x6a0dad,
            wireframe: true,
            roughness: 0.2,
            metalness: 0.8
        });
        const shape = new THREE.Mesh(geometry, material);
        scene.add(shape);

        camera.position.z = 6;

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            shape.rotation.x += 0.005;
            shape.rotation.y += 0.008;
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // UI Interactions
        function triggerAction(type) {
            const output = document.getElementById('ai-output');
            output.style.display = 'block';
            
            if (type === 'logo') {
                output.innerText = "KNOCKSSTUDiOS Engine Active.";
                shape.material.color.setHex(0x00ffff);
            } else if (type === 'storyboard') {
                output.innerText = "Ready to build interactive 3D scenes and storyboards.";
                shape.material.color.setHex(0xff007f);
            }
        }
    </script>
</body>
</html>
